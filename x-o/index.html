<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-card {
            background: white;
            padding: 20px 24px 24px;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            text-align: center;
        }

        .game-card h1 {
            margin: 0 0 15px;
        }

        .parent-div {
            width: 300px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .parent-div div {
            height: 95px;
            border-radius: 10px;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .parent-div div:hover {
            background: #dee2e6;
        }

        .parent-div div:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="game-card">
        <h1>Tic Tac Toe</h1>

        <div class="parent-div">
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
